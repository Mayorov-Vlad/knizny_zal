name: Киноархив
on:
  schedule:
    - cron: "17 2 1 * *"   # 1-го числа каждого месяца
  workflow_dispatch:
  push:
    branches: [main]
    paths: [tools/build_films.py]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python tools/build_films.py
      - name: Сохранить
        run: |
          git config user.name "Mayorov-Vlad"
          git config user.email "vladislav15333@gmail.com"
          git add films/films.json
          git diff --cached --quiet || git commit -m "Киноархив: обновление $(date +%Y-%m-%d)"
          git pull --rebase -q && git push
